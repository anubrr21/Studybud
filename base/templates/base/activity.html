{% extends 'main.html' %}
{% block content %}

<main class="layout">
  <div class="container">

    <div class="layout__box">

      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <a href="{% url 'home' %}">
            <svg width="32" height="32" viewBox="0 0 32 32">
              <path d="M13.723 2.286l-13.723 13.714 13.719 13.714 1.616-1.611-10.96-10.96h27.625v-2.286h-27.625l10.965-10.965-1.616-1.607z"></path>
            </svg>
          </a>
          <h3>Recent Activities</h3>
        </div>
      </div>

      <div class="layout__body" style="display:flex; flex-direction:column; height:70vh;">

  <!-- SEARCH BAR (fixed at top) -->
  <form method="GET" action="{% url 'activity' %}" style="margin-bottom:15px;">
    <input type="text"
           name="q"
           value="{{ search_query }}"
           placeholder="Search by username, room, message..."
           style="width:100%;padding:10px;border-radius:8px;border:none;">
  </form>

  <!-- SCROLLABLE ACTIVITY SECTION -->
  <div style="flex:1; overflow-y:auto; padding-right:5px;">

    {% for message in room_messages %}
    <div class="activities__box">

      <div class="activities__boxHeader roomListRoom__header">
        <a href="{% url 'user-profile' message.user.id %}" class="roomListRoom__author">
          <div class="avatar avatar--small">
            <img src="{{message.user.avatar_url}}" />
          </div>
          <p>
            @{{message.user.username}}
            <span>{{message.created|timesince}} ago</span>
          </p>
        </a>
      </div>

      <div class="activities__boxContent">
        <p>
          replied to post
          “<a href="{% url 'room' message.room.id %}">
            {{message.room}}
          </a>”
        </p>

        <div class="activities__boxRoomContent">
          {{message.body}}
        </div>
      </div>

    </div>
    {% endfor %}

  </div>
</div>
    </div>

  </div>
</main>

{% endblock %}
