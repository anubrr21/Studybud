{% extends 'main.html' %}

{% block content %}
<style>
    .verify-container {
        max-width: 500px;
        margin: 5rem auto;
        padding: 3rem;
        background: var(--color-dark);
        border-radius: 1rem;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .verify-title {
        color: var(--color-main);
        font-size: 2.4rem;
        margin-bottom: 1rem;
        text-align: center;
    }
    
    .verify-subtitle {
        color: var(--color-light-gray);
        font-size: 1.4rem;
        margin-bottom: 2.5rem;
        text-align: center;
    }
    
    .code-input {
        width: 100%;
        padding: 1.5rem;
        background: var(--color-dark-medium);
        border: 2px solid var(--color-dark-light);
        border-radius: 1rem;
        color: var(--color-light);
        font-size: 2rem;
        text-align: center;
        letter-spacing: 0.5rem;
        margin-bottom: 2rem;
        font-weight: bold;
    }
    
    .code-input:focus {
        border-color: var(--color-main);
        outline: none;
    }
    
    .verify-btn {
        width: 100%;
        padding: 1.5rem;
        background: var(--color-main);
        color: var(--color-dark);
        border: none;
        border-radius: 1rem;
        font-size: 1.6rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 1.5rem;
    }
    
    .verify-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }
    
    .resend-link {
        text-align: center;
        display: block;
        color: var(--color-main);
        text-decoration: none;
        font-size: 1.4rem;
        margin-top: 1.5rem;
    }
    
    .resend-link:hover {
        text-decoration: underline;
    }
    
    .error-message {
        background: rgba(252, 75, 11, 0.1);
        border: 1px solid var(--color-error);
        color: var(--color-error);
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 2rem;
        text-align: center;
    }
    
    .success-message {
        background: rgba(93, 214, 147, 0.1);
        border: 1px solid var(--color-success);
        color: var(--color-success);
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 2rem;
        text-align: center;
    }
</style>

<div class="container">
    <div class="verify-container">
        <h1 class="verify-title">Verify Your Email</h1>
        <p class="verify-subtitle">We've sent a 6-digit verification code to your email. Please enter it below.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'success' %}success-message{% else %}error-message{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" 
                   name="verification_code" 
                   class="code-input" 
                   placeholder="••••••"
                   maxlength="6"
                   pattern="\d{6}"
                   title="Please enter a 6-digit code"
                   required
                   autofocus>
            
            <button type="submit" class="verify-btn">Verify Email</button>
        </form>
        
        <a href="{% url 'resend-verification' user_id=user_id %}" class="resend-link">Resend verification code</a>
    </div>
</div>
{% endblock %}
