{% load static %}

<header class="header header--loggedIn">
  <div class="container">

    <!-- Logo -->
    <a href="{% url 'home' %}" class="header__logo">
      <img src="{% static 'images/logo.svg' %}" />
      <h1>StudyBuddy</h1>
    </a>

    <!-- Search -->
    <form class="header__search" method="GET" action="{% url 'home' %}">
      <label>
        <svg width="32" height="32" viewBox="0 0 32 32">
          <path d="M32 30.586l-10.845-10.845c1.771-2.092 2.845-4.791 2.845-7.741 
                   0-6.617-5.383-12-12-12s-12 5.383-12 12c0 6.617 5.383 12 12 12 
                   2.949 0 5.649-1.074 7.741-2.845l10.845 10.845 1.414-1.414zM12 
                   22c-5.514 0-10-4.486-10-10s4.486-10 10-10c5.514 0 10 4.486 
                   10 10s-4.486 10-10 10z">
          </path>
        </svg>
        <input name="q" placeholder="Search for posts..." />
      </label>
    </form>

    <!-- Menu -->
    <nav class="header__menu">

      {% if request.user.is_authenticated %}
      <div style="position:relative; margin-right:20px;">
  <a href="#">
    🔔
    {% if notification_count > 0 %}
      <span style="
        position:absolute;
        top:-8px;
        right:-10px;
        background:red;
        color:white;
        font-size:10px;
        padding:2px 6px;
        border-radius:50%;
      ">
        {{ notification_count }}
      </span>
    {% endif %}
  </a>
</div>


        <div class="header__user">
          <a href="{% url 'update-user' %}">
            <div class="avatar avatar--medium active">
              <img src="{{ request.user.avatar_url }}" />
            </div>
            <p>
              {{ request.user.username }}
              <span>@{{ request.user.username }}</span>
            </p>
          </a>

          <button class="dropdown-button">
            <svg width="32" height="32" viewBox="0 0 32 32">
              <path d="M16 21l-13-13h-3l16 16 16-16h-3l-13 13z"></path>
            </svg>
          </button>
        </div>

        <div class="dropdown-menu">
          <a href="{% url 'update-user' %}" class="dropdown-link">Settings</a>
          <a href="{% url 'logout' %}" class="dropdown-link">Logout</a>
        </div>

      {% else %}

        <a href="{% url 'login' %}">
          <img src="{% static 'images/avatar.svg' %}" />
          <p>Login</p>
        </a>

      {% endif %}

    </nav>

  </div>
</header>
