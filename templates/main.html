<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="{% static 'styles/style.css' %}" />
    <title>StudyBuddy - Find study partners around the world!</title>
  </head>

  <body>
    <!-- Toast notifications container -->
    <div class="toast-container" id="toastContainer"></div>
   
    {% include 'navbar.html' %}
  
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{message}}</li>
        {% endfor %}
    </ul>
    {% endif %}
    
    {% block content %}
    {% endblock %}
    
    <script src="{% static 'js/script.js' %}"></script>
    
    <!-- ONE SIGNAL - SIMPLE AS IT GETS -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>
    <script>
      // This is ALL you need - no extra code!
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function(OneSignal) {
         OneSignal.init({
      appId: "9a9d316f-aaeb-4eca-95ee-c70a32e1b3d1",
      autoPrompt: true,  // Add this
      promptOptions: {
        slidedown: {
          prompts: [{
            type: "push",
            autoPrompt: true,
            text: {
              acceptButton: "Allow",
              cancelButton: "No Thanks",
              message: "Get study reminders and notifications from StudyBud!"
            }
          }]
        }
      }
    });
    
    // Force show prompt after 3 seconds if not subscribed
    setTimeout(() => {
      OneSignal.Notions.getPermission().then(permission => {
        if (permission === 'default') {
          OneSignal.showSlidedownPrompt();
        }
      });
    }, 3000);
  });
      
      console.log("✅ OneSignal initialized");
    </script>
    
    <!-- Toast notification system (your existing code) -->
    <script>
    function showToast(message, type = 'info', title = '') {
        const container = document.getElementById('toastContainer');
        
        if (!title) {
            switch(type) {
                case 'success': title = 'Success!'; break;
                case 'error': title = 'Error!'; break;
                case 'warning': title = 'Warning!'; break;
                default: title = 'Info';
            }
        }
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = '';
        if (type === 'success') {
            icon = '<path d="M20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4C12.76,4 13.5,4.11 14.2,4.31L15.77,2.74C14.61,2.26 13.34,2 12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12M7.91,10.08L6.5,11.5L11,16L21,6L19.59,4.58L11,13.17L7.91,10.08Z"/>';
        } else if (type === 'error') {
            icon = '<path d="M12,2C17.53,2 22,6.47 22,12C22,17.53 17.53,22 12,22C6.47,22 2,17.53 2,12C2,6.47 6.47,2 12,2M15.59,7L12,10.59L8.41,7L7,8.41L10.59,12L7,15.59L8.41,17L12,13.41L15.59,17L17,15.59L13.41,12L17,8.41L15.59,7Z"/>';
        } else if (type === 'warning') {
            icon = '<path d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16"/>';
        } else {
            icon = '<path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M11,16.5L16.5,11L15.08,9.58L11,13.67L8.92,11.59L7.5,13L11,16.5Z"/>';
        }
        
        toast.innerHTML = `
            <div class="toast-icon">
                <svg viewBox="0 0 24 24">${icon}</svg>
            </div>
            <div class="toast-content">
                <div class="toast-title">${title}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
        `;
        
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 5000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const messages = document.querySelectorAll('.messages li');
        messages.forEach(msg => {
            showToast(msg.textContent, 'info');
            msg.remove();
        });
    });

    document.querySelectorAll(".like-btn").forEach(button => {
        button.addEventListener("click", function() {
            const roomId = this.dataset.room;
            fetch(`/like-room/${roomId}/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCookie("csrftoken"),
                    "Content-Type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById(`like-count-${roomId}`).innerText = data.total_likes;
                button.innerHTML = data.liked ? "❤️" : "🤍";
            });
        });
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    </script>

  </body>
</html>
