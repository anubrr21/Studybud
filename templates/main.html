<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="{% static 'styles/style.css' %}" />
    <title>StudyBuddy - Find study partners around the world!</title>
  </head>

  <body>
    <!-- Toast notifications container -->
    <div class="toast-container" id="toastContainer"></div>
   
    {% include 'navbar.html' %}
  
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{message}}</li>
        {% endfor %}
    </ul>
    {% endif %}
    

    {% block content %}


    {% endblock %}
    
    <script src="{%static 'js/script.js' %}"></script>
    <script>
      
// Toast notification system
function showToast(message, type = 'info', title = '') {
    const container = document.getElementById('toastContainer');
    
    // Set title based on type
    if (!title) {
        switch(type) {
            case 'success':
                title = 'Success!';
                break;
            case 'error':
                title = 'Error!';
                break;
            case 'warning':
                title = 'Warning!';
                break;
            default:
                title = 'Info';
        }
    }
    
    // Create toast element
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    // Set icon based on type
    let icon = '';
    if (type === 'success') {
        icon = '<path d="M20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4C12.76,4 13.5,4.11 14.2,4.31L15.77,2.74C14.61,2.26 13.34,2 12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12M7.91,10.08L6.5,11.5L11,16L21,6L19.59,4.58L11,13.17L7.91,10.08Z"/>';
    } else if (type === 'error') {
        icon = '<path d="M12,2C17.53,2 22,6.47 22,12C22,17.53 17.53,22 12,22C6.47,22 2,17.53 2,12C2,6.47 6.47,2 12,2M15.59,7L12,10.59L8.41,7L7,8.41L10.59,12L7,15.59L8.41,17L12,13.41L15.59,17L17,15.59L13.41,12L17,8.41L15.59,7Z"/>';
    } else if (type === 'warning') {
        icon = '<path d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16"/>';
    } else {
        icon = '<path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M11,16.5L16.5,11L15.08,9.58L11,13.67L8.92,11.59L7.5,13L11,16.5Z"/>';
    }
    
    toast.innerHTML = `
        <div class="toast-icon">
            <svg viewBox="0 0 24 24">${icon}</svg>
        </div>
        <div class="toast-content">
            <div class="toast-title">${title}</div>
            <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.classList.add('hide'); setTimeout(() => this.parentElement.remove(), 300);">&times;</button>
    `;
    
    container.appendChild(toast);
    
    // Auto remove after 5 seconds
    setTimeout(() => {
        if (toast.parentElement) {
            toast.classList.add('hide');
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.remove();
                }
            }, 300);
        }
    }, 5000);
}

// Replace Django messages with toasts
document.addEventListener('DOMContentLoaded', function() {
    // Check for Django messages in the page
    const messages = document.querySelectorAll('.messages .message');
    if (messages.length > 0) {
        messages.forEach(msg => {
            const text = msg.textContent.trim();
            if (msg.classList.contains('success')) {
                showToast(text, 'success');
            } else if (msg.classList.contains('error')) {
                showToast(text, 'error');
            } else {
                showToast(text, 'info');
            }
            msg.remove(); // Remove original message
        });
    }
    
    // Check for welcome message
    const welcomeMsg = document.querySelector('.welcome-message');
    if (welcomeMsg) {
        const text = welcomeMsg.textContent.trim();
        if (text.includes('Welcome back')) {
            showToast(text, 'success', 'Welcome Back! 👋');
        } else if (text.includes('Welcome')) {
            showToast(text, 'success', 'Welcome! 🎉');
        }
        welcomeMsg.remove();
    }
});


document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll(".like-btn").forEach(button => {

    button.addEventListener("click", function () {

      const roomId = this.dataset.room;

      fetch(`/like-room/${roomId}/`, {
        method: "POST",
        headers: {
          "X-CSRFToken": getCookie("csrftoken"),
          "Content-Type": "application/json"
        }
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById(`like-count-${roomId}`).innerText = data.total_likes;

        if (data.liked) {
          button.innerHTML = "❤️";
        } else {
          button.innerHTML = "🤍";
        }
      });

    });

  });

});

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>

<!-- OneSignal Push Notifications -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "9a9d316f-aaeb-4eca-95ee-c70a32e1b3d1", // ✅ Your App ID
      safari_web_id: "",
      notifyButton: {
        enable: true,
      },
      allowLocalhostAsSecureOrigin: true,
      serviceWorkerParam: { scope: '/' },
      serviceWorkerPath: '/static/js/OneSignalSDKWorker.js', 
      welcomeNotification: {
        title: "StudyBud",
        message: "Thanks for subscribing! You'll now receive study reminders 📚",
      },
    });
    
    // Check if user is logged in (Django template tag)
    {% if request.user.is_authenticated %}
    try {
      OneSignal.login("{{ request.user.id }}");
      OneSignal.setExternalUserId("{{ request.user.id }}");
      console.log("OneSignal: User logged in as {{ request.user.id }}");
    } catch (e) {
      console.log("OneSignal login error:", e);
    }
    {% endif %}
  });
</script>

<!-- OneSignal Permission Check Script -->
<script>
// Check if user has granted permission
document.addEventListener('DOMContentLoaded', function() {
    // Check OneSignal status after a short delay to ensure it's loaded
    setTimeout(function() {
        if (window.OneSignal) {
            OneSignal.Notifications.permissionNative.then(function(permission) {
                console.log('OneSignal permission status:', permission);
                
                // You can show a toast based on permission status
                if (permission === 'granted') {
                    // Optional: Show a welcome toast for notifications
                    // showToast('Notifications enabled! You\'ll receive study reminders.', 'success', '🔔 Notifications On');
                } else if (permission === 'denied') {
                    // Optional: Show a warning
                    // showToast('Notifications are blocked. Enable them in browser settings to get reminders.', 'warning', '⚠️ Notifications Off');
                }
            }).catch(function(error) {
                console.log('Error checking OneSignal permission:', error);
            });
            
            // Get the current subscription state
            OneSignal.User.PushSubscription.addEventListener('change', function (subscription) {
                console.log('Push subscription changed:', subscription);
                if (subscription.token) {
                    console.log('User is subscribed with token:', subscription.token);
                }
            });
        } else {
            console.log('OneSignal not loaded yet');
        }
    }, 1000); // Wait 1 second for OneSignal to load
});

// Optional: Function to manually trigger notification prompt
function enableNotifications() {
    if (window.OneSignal) {
        OneSignal.Notifications.requestPermission();
    } else {
        alert("Notification system is still loading. Please try again in a moment.");
    }
}

// Optional: Check if service workers are supported
if ('serviceWorker' in navigator) {
    console.log('Service Worker is supported');
} else {
    console.log('Service Worker is not supported - notifications may not work');
}
</script>

  </body>
</html>
